name: Publish v0.6.3 source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'chore: trigger v0.6.3 source publish'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/source.b64
          for n in $(seq -w 0 17); do
            path="_upload/source.b64.${n}"
            found=""
            while read -r commit; do
              if git cat-file -e "${commit}:${path}" 2>/dev/null; then
                found="$commit"
                break
              fi
            done < <(git log --all --format=%H -- "$path")
            if [ -z "$found" ]; then
              echo "Missing historical source chunk: $path" >&2
              exit 1
            fi
            git show "${found}:${path}" >> /tmp/source.b64
          done
          base64 --decode /tmp/source.b64 > /tmp/source.tar.xz
          echo "86e01b55baacd2584fbf41fde72f5748517d0eed51c32a6d13e8904322523713  /tmp/source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/source.tar.xz -C .

      - name: Clean staging and commit source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _upload _stage _bootstrap
          rm -f .github/workflows/publish-v063-source.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Tickle my List v0.6.3 source"
          git push
