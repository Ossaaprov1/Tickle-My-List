name: Import v0.6.3 source

on:
  workflow_dispatch:
  push:
    paths:
      - '_upload/source.b64.17'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and extract source tree
        shell: bash
        run: |
          set -euo pipefail
          cat _upload/source.b64.* > /tmp/tickle-source.b64
          base64 --decode /tmp/tickle-source.b64 > /tmp/tickle-source.tar.xz
          tar -xJf /tmp/tickle-source.tar.xz -C .
          rm -rf _upload
          rm -f .github/workflows/import-v063-source.yml

      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: import Tickle my List v0.6.3 source"
          git push origin HEAD:main
